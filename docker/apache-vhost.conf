<VirtualHost *:80>
    ServerAdmin contact@salmete.com
    ServerName salmete.com
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Défense en profondeur : aucun fichier PHP ne doit être exécuté depuis
    # les uploads publics (storage/app/public est lié dans public/storage).
    <DirectoryMatch "^/var/www/html/(storage|bootstrap|config|database|resources|routes|tests|vendor|docker)(/|$)">
        Require all denied
    </DirectoryMatch>

    # --- Compression des réponses texte ---
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml \
            text/javascript application/javascript application/json \
            application/xml image/svg+xml
    </IfModule>

    # --- Cache long pour les assets Vite fingerprintés ---
    <Directory /var/www/html/public/build>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>

    # --- Pas de cache pour le HTML / l'administration ---
    <IfModule mod_headers.c>
        <FilesMatch "\.(php|html?)$">
            Header set Cache-Control "no-cache, private"
        </FilesMatch>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
