# =============================================================================
# SaLMeTE — durcissement Apache (chargé via a2enconf salmete-security)
# =============================================================================

# Ne pas divulguer la version d'Apache ni les modules.
ServerTokens Prod
ServerSignature Off

# Interdire la méthode TRACE (cross-site tracing).
TraceEnable Off

# En-têtes de sécurité de base. Le HSTS est volontairement limité à l'apex
# (pas d'includeSubDomains tant que tous les sous-domaines ne sont pas HTTPS).
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000"
</IfModule>
