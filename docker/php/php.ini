; =============================================================================
; SaLMeTE — configuration PHP de production
; Copiée dans /usr/local/etc/php/conf.d/zz-salmete.ini (charge après les défauts)
; =============================================================================

; --- Affichage des erreurs : jamais au navigateur en production ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Limites : uploads galerie/logo (validation applicative max 5 Mo) ---
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 60

; --- Cookies / sessions ---
session.cookie_httponly = 1
session.use_strict_mode = 1
; Vecteur d'attaque de type PHP2Shell : inutile ici, désactivé.
session.upload_progress.enabled = 0

; --- OPcache : code PHP figé dans l'image, redémarré à chaque déploiement ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
